<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواصفات حاسوبي - Dell Latitude 5410</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 25px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #0076ce;
            margin-bottom: 20px;
        }
        /* معرض الصور */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        /* جدول الخصائص */
        .specs-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .specs-table th, .specs-table td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }
        .specs-table th {
            background-color: #f8f9fa;
            color: #0076ce;
            width: 35%;
        }
        .specs-table tr:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💻 مواصفات حاسوبي - Dell Latitude 5410</h1>

    <!-- معرض الصور (تأكد من مطابقة أسماء الملفات) -->
    <div class="gallery">
        <img src="dell_front.jpg" alt="صورة الحاسوب من الأمام">
        <img src="dell_keyboard.jpg" alt="لوحة المفاتيح">
        <img src="dell_side.jpg" alt="المظهر الجانبي">
    </div>

    <!-- جدول الخصائص -->
    <table class="specs-table">
        <tr>
            <th>الموديل (Model)</th>
            <td>Dell Latitude 5410</td>
        </tr>
        <tr>
            <th>المعالج (CPU)</th>
            <td>Intel® Core™ i5-10310U (4 Cores / 8 Threads)</td>
        </tr>
        <tr>
            <th>الذاكرة العشوائية (RAM)</th>
            <td>16 GB DDR4</td>
        </tr>
        <tr>
            <th>التخزين (Storage)</th>
            <td>256 GB NVMe SSD</td>
        </tr>
        <tr>
            <th>بطاقة الشاشة (GPU)</th>
            <td>Intel® UHD Graphics</td>
        </tr>
        <tr>
            <th>نظام التشغيل (OS)</th>
            <td>Windows 10</td>
        </tr>
    </table>
</div>

</body>
</html>
